<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark parchment background -->
  <rect width="64" height="64" rx="10" fill="#1a1209"/>
  
  <!-- Radial glow behind castle -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ff8c00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a1209" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0c75e"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b2e2e"/>
      <stop offset="50%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#f0c75e"/>
    </linearGradient>
  </defs>
  
  <!-- Ambient glow -->
  <circle cx="32" cy="38" r="28" fill="url(#glow)"/>
  
  <!-- Castle main body -->
  <rect x="14" y="30" width="36" height="24" fill="url(#goldGrad)" stroke="#3a2a14" stroke-width="1"/>
  
  <!-- Left tower -->
  <rect x="10" y="22" width="10" height="32" fill="url(#goldGrad)" stroke="#3a2a14" stroke-width="1"/>
  
  <!-- Right tower -->
  <rect x="44" y="22" width="10" height="32" fill="url(#goldGrad)" stroke="#3a2a14" stroke-width="1"/>
  
  <!-- Center tower (taller) -->
  <rect x="26" y="16" width="12" height="38" fill="url(#goldGrad)" stroke="#3a2a14" stroke-width="1"/>
  
  <!-- Battlements (crenellations) on left tower -->
  <rect x="10" y="20" width="2.5" height="3" fill="#d4af6e"/>
  <rect x="14" y="20" width="2.5" height="3" fill="#d4af6e"/>
  <rect x="17.5" y="20" width="2.5" height="3" fill="#d4af6e"/>
  
  <!-- Battlements on right tower -->
  <rect x="44" y="20" width="2.5" height="3" fill="#d4af6e"/>
  <rect x="48" y="20" width="2.5" height="3" fill="#d4af6e"/>
  <rect x="51.5" y="20" width="2.5" height="3" fill="#d4af6e"/>
  
  <!-- Battlements on center tower -->
  <rect x="26" y="14" width="3" height="3" fill="#d4af6e"/>
  <rect x="30.5" y="14" width="3" height="3" fill="#d4af6e"/>
  <rect x="35" y="14" width="3" height="3" fill="#d4af6e"/>
  
  <!-- Castle gate (arched door) -->
  <path d="M 28 54 L 28 44 Q 28 38 32 38 Q 36 38 36 44 L 36 54 Z" fill="#1a1209" stroke="#3a2a14" stroke-width="0.5"/>
  
  <!-- Gate door details -->
  <line x1="32" y1="38" x2="32" y2="54" stroke="#8b6914" stroke-width="0.5"/>
  <circle cx="30" cy="48" r="0.6" fill="#d4af6e"/>
  <circle cx="34" cy="48" r="0.6" fill="#d4af6e"/>
  
  <!-- Left tower window -->
  <rect x="13" y="30" width="4" height="5" fill="#1a1209"/>
  <rect x="13.5" y="30.5" width="3" height="4" fill="#ff8c00" opacity="0.7"/>
  
  <!-- Right tower window -->
  <rect x="47" y="30" width="4" height="5" fill="#1a1209"/>
  <rect x="47.5" y="30.5" width="3" height="4" fill="#ff8c00" opacity="0.7"/>
  
  <!-- Center tower window (arched) -->
  <path d="M 29 28 L 29 24 Q 29 21 32 21 Q 35 21 35 24 L 35 28 Z" fill="#1a1209"/>
  <path d="M 29.5 27.5 L 29.5 24 Q 29.5 21.5 32 21.5 Q 34.5 21.5 34.5 24 L 34.5 27.5 Z" fill="#ff8c00" opacity="0.8"/>
  
  <!-- Flag pole on center tower -->
  <line x1="32" y1="14" x2="32" y2="6" stroke="#3a2a14" stroke-width="1"/>
  
  <!-- Flag -->
  <path d="M 32 6 L 40 8 L 32 11 Z" fill="#8b2e2e" stroke="#3a2a14" stroke-width="0.3"/>
  
  <!-- Torch flames on side towers -->
  <ellipse cx="15" cy="18" rx="2" ry="3.5" fill="url(#flameGrad)" opacity="0.9"/>
  <ellipse cx="15" cy="18.5" rx="1" ry="2" fill="#f0c75e" opacity="0.8"/>
  
  <ellipse cx="49" cy="18" rx="2" ry="3.5" fill="url(#flameGrad)" opacity="0.9"/>
  <ellipse cx="49" cy="18.5" rx="1" ry="2" fill="#f0c75e" opacity="0.8"/>
</svg>